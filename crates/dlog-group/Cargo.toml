[package]
name = "dlog-group"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = [
	"Mario Scuro <mscuro@fbk.eu>"
	]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["ristretto"]               # if no one specifies, ristretto is chosen
ristretto = ["dep:curve25519-dalek"] 
p256 = ["dep:p256"]      
k256 = ["dep:k256"]      
p384 = ["dep:p384"]      

[dependencies]
curve25519-dalek = {workspace = true, optional = true}
p256 = {workspace = true, optional = true}
k256 = {workspace = true, optional = true}
p384 = {workspace = true, optional = true}
rand_core.workspace = true
serde.workspace = true
zeroize.workspace = true
base64ct.workspace = true
merlin.workspace = true
rand_chacha.workspace = true

[dev-dependencies]
serde_json.workspace = true
rand.workspace = true
criterion.workspace = true

[[bench]]
name = "group_bench"
path = "benches/group_bench.rs"
harness = false
required-features = ["ristretto", "k256", "p384", "p256"]
